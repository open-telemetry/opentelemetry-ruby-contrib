include:
  - ./.docker/volume/bundler.yml
  - ./.docker/devcontainer/ubuntu/compose.yml
  - ./.docker/infra/kafka/docker-compose.yml
  - ./.docker/infra/memcached/docker-compose.yml
  - ./.docker/infra/mongo/docker-compose.yml
  - ./.docker/infra/mysql/docker-compose.yml
  - ./.docker/infra/postgres/docker-compose.yml
  - ./.docker/infra/rabbitmq/docker-compose.yml
  - ./.docker/infra/redis/docker-compose.yml

services:
  app:
    extends:
      service: base
      file: ./docker-base.yml
    build:
      context: .
    working_dir: /app
    environment:
      - MEMCACHED_URL=memcached:11211
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - TEST_MYSQL_HOST=mysql
      - TEST_POSTGRES_HOST=postgres
      - TEST_RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - kafka
      - jaeger
      - mysql
      - mongo
      - memcached
      - otelcol
      - postgres
      - rabbitmq
      - redis

  ex-instrumentation-mysql2-test:
    extends:
      service: base
      file: ./docker-base.yml
    environment:
      - TEST_MYSQL_HOST=mysql
    depends_on:
      - mysql
    working_dir: /app/instrumentation/mysql2/

  ex-instrumentation-pg-test:
    extends:
      service: base
      file: ./docker-base.yml
    environment:
      - TEST_POSTGRES_HOST=postgres
    depends_on:
      - postgres
    tmpfs: !reset []
    working_dir: /app/instrumentation/pg/

  ex-instrumentation-que-test:
    extends:
      service: base
      file: ./docker-base.yml
    environment:
      - TEST_POSTGRES_HOST=postgres
    depends_on:
      - postgres
    working_dir: /app/instrumentation/que

  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports:
      - "16686:16686"

  otelcol:
    image: otel/opentelemetry-collector:0.162.0@sha256:310a800ad69ee430e7c541796852a242c9c7db97aaad4daa5ccf843c525fbdb2
    command: ["--config=/etc/otelcol-config.yml"]
    volumes:
      - ./otelcol-config.yml:/etc/otelcol-config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
