name: Build

on:
  workflow_call:
    inputs:
      gems:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-build # Ensure that only one instance of this workflow is running per event type and ref
  cancel-in-progress: true # Cancel any previous runs of this workflow for the same event type and ref

jobs:
  build:
    runs-on: ${{matrix.os}}
    if: ${{ github.repository == 'open-telemetry/opentelemetry-ruby-contrib' && inputs.gems != '[]' }}
    strategy:
      matrix:
        gem: ${{ fromJson(inputs.gems) }}
        os:
          - ubuntu-24.04
      fail-fast: false
    name: "${{ matrix.gem }} / ${{matrix.os}}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "ruby-3.3.11"
      - name: Compute Gemfile hash
        id: lockhash
        shell: bash
        working-directory: ${{ steps.setup.outputs.gem_dir }}
        run: |
          files=$( find . -name "Gemfile" | sort )
          if [[ -n "$files" ]]; then
            hash=$(sha256sum $files | sha256sum | cut -d ' ' -f1)
            echo "hash=$hash" >> $GITHUB_OUTPUT
          else
            echo "hash=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          fi
      - name: Cache Bundler
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 #v5.0.4
        with:
          path: |
            vendor/bundle
          key: bundler-${{ runner.os }}-${{ matrix.gem }}-${{ matrix.ruby }}-${{ steps.lockhash.outputs.hash }}
          restore-keys: |
            bundler-${{ runner.os }}-${{ matrix.gem }}-${{ matrix.ruby }}-
      - name: Install Tools & Gem Deps
        run: |
          # ⚙️ Install ⚙️
          echo "::group:: Root"
          bundle install
          echo "::endgroup::"

          bundle exec rake install
        working-directory: "${{ steps.setup.outputs.gem_dir }}"
      - name: YARD
        shell: bash
        run: |
          # 📄 Yard Docs 📄
          bundle exec rake yard
        working-directory: "${{ steps.setup.outputs.gem_dir }}"
      - name: Build Gem
        shell: bash
        run: |
          # 📦 Build Gem 📦
          bundle exec rake build
        working-directory: "${{ steps.setup.outputs.gem_dir }}"
