name: Checks

on:
  workflow_call:
    inputs:
      gems:
        required: true
        type: string

permissions:
  contents: read

jobs:
  automated-checks:
    strategy:
      fail-fast: false
      matrix:
        gem: ${{ fromJson(inputs.gems) }}
        os:
          - ubuntu-26.04
          - macos-26
          - windows-2025
    name: ${{ matrix.gem }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: "npm"
          node-version-file: ".nvmrc"
      - name: Install Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler: latest
          bundler-cache: true
          ruby-version: "3.3.13"
      - name: Install Chrome (Ubuntu only)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          echo "PUPPETEER_SKIP_DOWNLOAD=true" >> $GITHUB_ENV
          echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome" >> $GITHUB_ENV
      - name: Install Chrome for Testing (macOS/Windows only)
        if: "${{!startsWith(matrix.os, 'ubuntu')}}"
        run: npx puppeteer browsers install chrome
      - name: Install Tools
        run: npm ci --ignore-scripts && npx puppeteer browsers install chrome
      - name: Run All Checks
        run: |
          npm run check
        env:
          lsconfig: "-c .github/.linkspector-local_check.yml"
