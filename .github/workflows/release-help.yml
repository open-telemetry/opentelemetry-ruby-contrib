name: Test / CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release-help.yml"
      - ".toys/release/Gemfile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toys_release:
    if: ${{ github.repository == 'open-telemetry/opentelemetry-ruby-contrib' }}
    runs-on: ubuntu-24.04
    name: Toys-Release
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/.toys/release/Gemfile
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0.7"
          bundler-cache: true

      - name: Show help
        run: |
          bundle exec toys release --help < /dev/null
