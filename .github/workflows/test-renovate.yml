name: Test / Renovate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/test-renovate.yml"
      - ".github/renovate.json5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }} # Ensure that only one instance of this workflow is running per event type and ref
  cancel-in-progress: true # Cancel any previous runs of this workflow for the same event type and ref

jobs:
  automated-checks:
    if: ${{ github.repository == 'open-telemetry/opentelemetry-ruby-contrib' }}
    strategy:
      fail-fast: false
    name: Dry-run
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Dry-run
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        env:
          LOG_LEVEL: debug
          RENOVATE_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RENOVATE_GITHUB_COM_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RENOVATE_DRY_RUN: full
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: open-telemetry/opentelemetry-ruby-contrib
