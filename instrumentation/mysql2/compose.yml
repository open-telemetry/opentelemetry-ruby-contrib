include:
  - ../../.docker/devcontainer/alpine/compose.yml
  - ../../.docker/infra/mysql/docker-compose.yml
  - ../../.docker/volume/bundler.yml

services:
  ex-instrumentation-mysql2-test:
    extends:
      service: devcontainer-alpine
      file: ../../.docker/devcontainer/alpine/compose.yml
    environment:
      - TEST_MYSQL_HOST=mysql
    depends_on:
      - mysql
    working_dir: /app/instrumentation/mysql2/
